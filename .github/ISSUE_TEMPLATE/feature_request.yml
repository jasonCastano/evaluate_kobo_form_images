name: "✨ Feature request"
description: "Propose a new feature or a concrete improvement."
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the **problem** before the solution. Check
        [`CONSTITUTION.md`](https://github.com/jasonCastano/evaluate_kobo_form_images/blob/main/CONSTITUTION.md)
        to align the proposal with the project scope.

  - type: textarea
    id: problem
    attributes:
      label: "Problem or need"
      placeholder: "As an evaluator I need ... so that ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "Proposed solution"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives considered"
    validations:
      required: false

  - type: textarea
    id: criteria
    attributes:
      label: "Acceptance criteria"
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
