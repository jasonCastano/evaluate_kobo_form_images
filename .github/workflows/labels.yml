name: Labels

# Syncs the repository labels from .github/labels.yml (no commits are made).
on:
  push:
    branches: [main]
    paths:
      - .github/labels.yml
      - .github/workflows/labels.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  labeler:
    name: Sync labels
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply labels
        uses: crazy-max/ghaction-github-labeler@v5
        with:
          yaml: .github/labels.yml
          # Do not delete labels that are missing from the file (avoids surprises).
          skip-delete: true
